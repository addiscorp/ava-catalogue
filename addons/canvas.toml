# Canvas: a whiteboard (Excalidraw, stored as JSON Canvas) that the person and Ava draw on together.
repo = "avacanada/ava-canvas"
# avacanada/ava-canvas#1, 0.1.0, at that PR's head. Merge it before this
# entry: that repo merges with merge commits, so this commit then stays on its
# main.
commit = "c44a6fc1b390d3aa89cf6c68118178842bac1023"
version = "0.1.0"
publisher = "Addis"
permissions = ["files", "storage", "tools"]
egress = []

[[tools]]
name = "read_board"
effect = "read"

[[tools]]
name = "add_elements"
effect = "inside"

[[tools]]
name = "add_mermaid"
effect = "inside"

[[tools]]
name = "update_elements"
effect = "inside"

[[tools]]
name = "delete_elements"
effect = "inside"

[[tools]]
name = "undo"
effect = "inside"

[[tools]]
name = "look_at_board"
effect = "read"
