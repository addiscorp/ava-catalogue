# Create: a design canvas where Ava builds pages as HTML/CSS artboards with tools.
repo = "avacanada/ava-create"
# avacanada/ava-create#4 (Ava's live colours: styles.variables, not styles),
# 0.2.1, at that PR's head. Merge it before this entry: that repo merges with
# merge commits, so this commit then stays on its main. 0.2.1 is the first
# version published from avacanada/ava-create.
commit = "7236e779863e7f39ed446641c5ef654aa3a62f36"
version = "0.2.1"
publisher = "Addis"
permissions = ["storage", "tools"]
egress = []

[[tools]]
name = "list_artboards"
effect = "read"

[[tools]]
name = "new_artboard"
effect = "inside"

[[tools]]
name = "read_artboard"
effect = "read"

[[tools]]
name = "write_artboard"
effect = "inside"

[[tools]]
name = "patch_artboard"
effect = "inside"

[[tools]]
name = "undo_artboard"
effect = "inside"

[[tools]]
name = "move_artboard"
effect = "inside"

[[tools]]
name = "delete_artboard"
effect = "inside"

[[tools]]
name = "get_tokens"
effect = "read"

[[tools]]
name = "set_tokens"
effect = "inside"

[[tools]]
name = "look_at_artboard"
effect = "read"

[[tools]]
name = "set_board_style"
effect = "inside"
